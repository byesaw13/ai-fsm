name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Branch protection requires all five jobs to pass before merge to main:
#   lint · typecheck · build · test · e2e-smoke
#
# See docs/CI_GOVERNANCE.md for the full branch protection policy and
# recovery procedures.
# ---------------------------------------------------------------------------

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ESLint across all workspaces
        run: pnpm lint
      - name: Reject new duplicate migration prefixes
        run: |
          node scripts/check-migration-prefixes.mjs
          node --test scripts/*.test.mjs

  # ── 2. Typecheck ─────────────────────────────────────────────────────────
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tsc --noEmit across all workspaces
        run: pnpm typecheck

  # ── 3. Build ─────────────────────────────────────────────────────────────
  # Runs after lint + typecheck. Uses NEXT_PHASE to trigger the build-time
  # env bypass in apps/web/lib/env.ts so real secrets are not required in CI.
  build:
    name: build
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    env:
      # Signal to env.ts that this is a build-time invocation.
      # Real secrets are NOT needed during `next build` (pages are force-dynamic).
      NEXT_PHASE: phase-production-build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-
      - name: Build all workspaces
        run: pnpm build

  # ── 4. Test ──────────────────────────────────────────────────────────────
  # Runs after lint + typecheck (parallel with build).
  #
  # Environment provided:
  #   DATABASE_URL / TEST_DATABASE_URL  — PostgreSQL 16 service fixture
  #   AUTH_SECRET                       — Required by env.ts (≥32 chars)
  #
  # Runs unit, direct-DB, and HTTP integration suites. E2E has its own job.
  test:
    name: test
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aifsm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/aifsm_test
      TEST_RUNTIME_DATABASE_URL: postgresql://ai_fsm_web:ci-runtime-only@localhost:5432/aifsm_test
      LOCATION_INTERNAL_KEY: ci-internal-test-only
      DATABASE_URL: postgresql://test:test@localhost:5432/aifsm_test
      # Required by env.ts (≥32 chars). This is a CI-only test secret.
      AUTH_SECRET: ci-test-only-secret-not-used-in-production!!
      TEST_BASE_URL: http://localhost:3000
      E2E_SKIP_EMAIL_DELIVERY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply schema migrations
        run: |
          for file in db/migrations/*.sql; do
            if [[ "$file" == *"seed"* ]]; then continue; fi
            echo "applying: $file"
            PGPASSWORD=test psql -h localhost -U test -d aifsm_test -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Apply seed data
        run: PGPASSWORD=test psql -h localhost -U test -d aifsm_test -v ON_ERROR_STOP=1 -f db/migrations/002_seed_dev.sql

      - name: Provision restricted test database role
        env:
          MIGRATION_DATABASE_URL: postgresql://test:test@localhost:5432/aifsm_test
          RUNTIME_DB_PASSWORD: ci-runtime-only
        run: bash scripts/db-provision-runtime.sh

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run database and HTTP integration tests
        run: |
          pnpm --filter @ai-fsm/web dev > /tmp/integration-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/integration-server.log' EXIT
          for attempt in {1..60}; do
            kill -0 "$server_pid" || exit 1
            if curl --silent --fail "$TEST_BASE_URL/api/health" > /dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail "$TEST_BASE_URL/api/health"
          pnpm test:integration

  # ── 5. Required E2E Smoke (Playwright) ───────────────────────────────────
  # Release-manifest smoke: login -> client -> job -> visit -> estimate ->
  # invoice -> payment. This is intentionally narrow and required.
  e2e-smoke:
    name: e2e-smoke
    needs: [build, test]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aifsm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/aifsm_test
      AUTH_SECRET: ci-e2e-test-secret-not-used-in-production!!
      TEST_BASE_URL: http://localhost:3000
      PLAYWRIGHT_USE_EXTERNAL_SERVER: "1"
      E2E_DISABLE_LOGIN_RATE_LIMIT: "1"
      E2E_SKIP_EMAIL_DELIVERY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply schema migrations
        run: |
          for file in db/migrations/*.sql; do
            if [[ "$file" == *"seed"* ]]; then continue; fi
            echo "applying: $file"
            PGPASSWORD=test psql -h localhost -U test -d aifsm_test -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Apply seed data
        run: PGPASSWORD=test psql -h localhost -U test -d aifsm_test -v ON_ERROR_STOP=1 -f db/migrations/002_seed_dev.sql

      - name: Build production app
        env:
          NEXT_PHASE: phase-production-build
        run: pnpm build

      - name: Start production server
        run: pnpm --filter @ai-fsm/web start &

      - name: Wait for server
        run: sleep 10 && curl -f http://localhost:3000/api/health

      - name: Run required release smoke
        run: pnpm exec playwright test tests/e2e/core-flow.spec.ts --reporter=list

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 7
